# Server Configuration
server.port=${SERVER_PORT:8080}

# Application Name
spring.application.name=FridgeMind

# Active Spring Profile: defaults to 'h2' for zero-configuration demonstration.
# Switch to 'mysql' via environment variable SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.fridgemind=DEBUG
logging.level.org.springframework.web=INFO
